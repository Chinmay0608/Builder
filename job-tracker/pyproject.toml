[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "job-tracker"
version = "0.1.0"
description = "Analyze your Gmail (IMAP) to track job applications and responses"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
job-tracker = "job_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["job_tracker*"]
